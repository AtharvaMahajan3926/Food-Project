<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | FoodShare Mumbai</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon">🍱</div>
          FoodShare
        </div>
        <div class="user-profile">
          <div class="user-avatar" id="user-avatar" style="background: var(--red);">A</div>
          <div class="user-info">
            <h4 id="user-name">Loading...</h4>
            <p id="user-role-label">ADMIN</p>
          </div>
        </div>
      </div>
      
      <div class="sidebar-nav">
        <div class="nav-group">
          <div class="nav-title">Management</div>
          <a href="#" onclick="switchTab('view-overview', this)" class="nav-item active"><i>📊</i> Dashboard</a>
          <a href="#" onclick="switchTab('view-verifications', this)" class="nav-item"><i>✅</i> Verifications</a>
        </div>
      </div>

      <div class="sidebar-footer">
        <button class="logout-btn" onclick="doLogout()">← Log Out</button>
      </div>
    </aside>

    <main class="main-wrapper">
      <header class="topbar">
        <h1 class="page-title">System Administrator</h1>
        <div style="display: flex; align-items: center;">
          <button id="themeToggleBtn" class="theme-toggle" aria-label="Toggle Theme">☀️</button>
          <div class="live-indicator">
            <div class="live-dot"></div>
            <span id="live-count">Loading...</span>
          </div>
        </div>
      </header>

      <section id="view-overview" class="content-area dashboard-view">
        <div class="stats-grid" id="stats-container">
          <!-- Stats loaded dynamically -->
        </div>

        <div class="glass-card" style="margin-top: 24px;">
          <h3>Pending User Approvals</h3>
          <p style="color: var(--text2); margin-bottom: 16px;">Users waiting for admin verification to access platform capabilities.</p>
          <div class="list-container" id="pending-verifications-list">
            <p style="color: var(--text3);">Loading pending verifications...</p>
          </div>
        </div>
      </section>

      <section id="view-verifications" class="content-area dashboard-view hidden">
        <div class="section-header">
          <h2>All Pending Verifications</h2>
        </div>
        <div class="glass-card">
          <div class="list-container" id="all-pending-verifications-list">
            <p style="color: var(--text3);">Loading pending verifications...</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/env.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/dashboard.js"></script>
  <script>
    async function loadDashboardData(user) {
      try {
        const stats = await apiFetch('/api/auth/admin/analytics');
        document.getElementById('stats-container').innerHTML = `
          ${renderStatCard('Total Meals Served', stats.total_meals_served, '🍱')}
          ${renderStatCard('Pending Verifications', stats.pending_verifications, '✅')}
          ${renderStatCard('Total Users', stats.total_users, '👥')}
        `;

        await loadPendingVerifications();
      } catch (e) {
        showToast('❌', 'Failed to load admin dashboard data', 'var(--red)');
      }
    }

    async function loadPendingVerifications() {
      try {
        const pending = await apiFetch('/api/auth/admin/pending-verifications');
        const renderList = (items) => {
          if (!items || items.length === 0) {
            return '<p style="color: var(--text3); padding: 12px;">No pending user verifications.</p>';
          }
          return items.map(u => `
            <div class="list-item" style="padding: 16px;">
              <div style="flex: 1;">
                <h4>${u.name} <span class="badge pending">${u.role}</span></h4>
                <p style="margin: 4px 0 0; color: var(--text2); font-size: 0.85rem;">📧 ${u.email} ${u.license_no ? '| 📜 License: ' + u.license_no : ''}</p>
              </div>
              <div style="display: flex; gap: 8px;">
                <button class="btn btn-primary btn-sm" onclick="approveUser('${u._id}')">Approve</button>
                <button class="btn btn-secondary btn-sm" onclick="rejectUser('${u._id}')">Reject</button>
              </div>
            </div>
          `).join('');
        };

        const overviewEl = document.getElementById('pending-verifications-list');
        if (overviewEl) overviewEl.innerHTML = renderList(pending);

        const allEl = document.getElementById('all-pending-verifications-list');
        if (allEl) allEl.innerHTML = renderList(pending);
      } catch (e) {
        showToast('❌', 'Failed to load pending verifications', 'var(--red)');
      }
    }

    async function approveUser(userId) {
      try {
        await apiFetch(`/api/auth/admin/verify-user/${userId}`, { method: 'POST' });
        showToast('✅', 'User approved successfully!', 'var(--accent)');
        loadDashboardData();
      } catch (e) {
        showToast('❌', e.message, 'var(--red)');
      }
    }

    async function rejectUser(userId) {
      try {
        await apiFetch(`/api/auth/admin/reject-user/${userId}`, { method: 'DELETE' });
        showToast('✅', 'User rejected & removed.', 'var(--amber)');
        loadDashboardData();
      } catch (e) {
        showToast('❌', e.message, 'var(--red)');
      }
    }
  </script>
</body>
</html>
