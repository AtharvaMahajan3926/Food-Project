version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: foodshare-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodshare-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DB_NAME=foodshare
      - SECRET_KEY=foodshare_secret_key_change_in_prod
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodshare-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  mongo_data:
